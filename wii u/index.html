<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wii U Modding ZIP</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      text-align: center;
      padding: 40px;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #2ea043;
    }
    #log {
      margin-top: 30px;
      text-align: left;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      background: #161b22;
      padding: 20px;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
    }
    #back-btn {
      position: absolute;
      top: 20px;
      left: 20px;

      background: #1b1b1b;
      color: #eee;
      border: none;
      padding: 8px 14px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    #back-btn:hover {
      background: #272727;
    }
  </style>
</head>
<body>
  <button id="back-btn">← Back</button>
  <script>
    document.getElementById("back-btn").addEventListener("click", () => {
    window.location.href = "/";
  });
  </script>

  <h1>Wii U Modding AIO download</h1></h1>
  <p>Click the button to download all latest tools and have them as one ZIP, just like in FunkyScott47's latest guide.</p>

  <button id="download-btn"> Download ZIP</button>

  <div id="log"></div>

  <script src="/aio.js"></script>
</body>
</html>
