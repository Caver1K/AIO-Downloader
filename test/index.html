<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Modding AIO</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 40px;
      display: flex;
      gap: 40px;
    }

    #main {
      flex: 1;
      text-align: center;
    }

    #extras-panel {
      width: 320px;
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      height: fit-content;
    }

    .extra-item {
      background: #1f242d;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .toggle {
      margin-top: 8px;
      background: #30363d;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .toggle.active {
      background: #238636;
    }

    button {
      background: #238636;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    #log {
      margin-top: 30px;
      text-align: left;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      background: #161b22;
      padding: 20px;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    #back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #1b1b1b;
      color: #eee;
      border: none;
      padding: 8px 14px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .extra-select-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .extra-select-btn {
      flex: 1;
      background: #30363d;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      user-select: none;
     }

    .extra-select-btn.active {
      background: #238636;
    }
  </style>
</head>

<body>
  <button id="back-btn">← Back</button>

  <script>
    document.getElementById("back-btn").addEventListener("click", () => {
      window.location.href = "/";
    });
  </script>

  <div id="main">
    <h1>Test Modding AIO download</h1>
    <p>Click the button to download all latest tools and have them as one ZIP.</p>

    <button id="download-btn">Download ZIP</button>

    <div id="log"></div>
  </div>

  <div id="extras-panel">
    <h2>Extras</h2>

    <h3>Homebrew</h3>
    <div id="extras-homebrew"></div>

    <h3>PC Tools</h3>
    <div id="extras-pc"></div>

    <h3>OS</h3>
    <div id="os-selector"></div>
  </div>

  <script src="test.js"></script>
</body>
</html>
